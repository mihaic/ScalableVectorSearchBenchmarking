[package]
name = "svsbench"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "SVS C API benchmarks in Rust"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
serde_json = "1"

[profile.release]
debug = 1
